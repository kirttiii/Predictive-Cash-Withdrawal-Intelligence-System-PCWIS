    permitted_recipient_roles: ["Investigator", "Analyst", "Admin"]
    permitted_fields: ["complaint_id", "loss_amount", "fraud_category", "timestamp", "account_number", "phone_number", "device_id", "upi_id", "sender_account", "receiver_account", "suspect_account", "tx_id", "tx_type", "flag_id", "risk_score", "flagged_reason"]
  
